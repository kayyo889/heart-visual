<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#c5b5e4"><title>Для тебя</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#c5b5e4;color:#302541;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100svh;background:radial-gradient(ellipse at 15% 0%,#e7dcf5 0%,transparent 65%),linear-gradient(150deg,#d1c2e9,#b7a2d6)}button{font:inherit;color:inherit;cursor:pointer;border:0}button:focus-visible{outline:3px solid #674b88;outline-offset:5px}[hidden]{display:none!important}.view{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px}.lock{width:min(100%,360px);text-align:center;padding:16px 0}.icon{width:27px;height:31px;margin:0 auto 24px}h1{font-size:22px;font-weight:500;line-height:1.5;margin:0 0 23px}h1 span{display:block;font-size:17px;font-weight:400}.dots{display:flex;justify-content:center;gap:18px;margin-bottom:12px}.dot{width:13px;height:13px;border:1.5px solid #51405f;border-radius:50%}.dot.filled{background:#51405f}.error{font-size:13px;height:20px;margin:12px 0 20px;color:#62334e}.keys{display:grid;grid-template-columns:repeat(3,78px);gap:17px 25px;justify-content:center}.key{border-radius:50%;height:78px;background:#ffffff45;display:flex;align-items:center;justify-content:center;flex-direction:column;touch-action:manipulation}.key:active{background:#fff9}.digit{font-size:32px;line-height:35px;font-weight:300}.letters{font-size:10px;letter-spacing:2px;height:13px}.delete{background:none;font-size:13px}.empty{visibility:hidden}.rotate{text-align:center;max-width:400px}.phone{width:52px;height:90px;border:3px solid #51405f;border-radius:12px;margin:0 auto 45px;transform:rotate(90deg)}.phone:after{content:'';display:block;width:18px;height:3px;background:#51405f;border-radius:5px;margin:7px auto}.rotate h2{font-size:25px;font-weight:500;line-height:1.5}.play{background:#ffffff60;border:1px solid #ffffff70;padding:15px 25px;border-radius:28px;margin-top:20px}#movie{position:fixed;inset:0;background:black;z-index:5;display:flex;align-items:center;justify-content:center}video{width:100%;height:100%;object-fit:contain}#fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000a;color:white}#fallback button{background:#ffffff25;border:1px solid #fff8;padding:18px 28px;border-radius:30px}body.playing{background:black}body.playing #gate,body.playing #turn{display:none}.shake{animation:shake .3s}@keyframes shake{25%,75%{transform:translateX(-7px)}50%{transform:translateX(7px)}}@media(max-height:680px) and (orientation:portrait){.lock{padding:0}.icon{margin-bottom:15px}h1{margin-bottom:17px}.key{height:66px}.keys{grid-template-columns:repeat(3,66px);gap:12px 24px}.error{margin:8px 0 12px}}@media(orientation:landscape) and (max-height:550px){.view{padding:12px}.lock{width:640px;display:grid;grid-template-columns:1fr 1fr;align-items:center}.heading{padding:20px}.keys{grid-template-columns:repeat(3,58px);gap:9px 20px}.key{height:58px}.digit{font-size:26px}.icon{margin-bottom:15px}}@media(prefers-reduced-motion:reduce){.shake{animation:none}}
</style></head><body><main id="gate" class="view"><section class="lock"><div class="heading"><svg class="icon" viewBox="0 0 28 32" fill="none" aria-hidden="true"><rect x="4" y="13" width="20" height="16" rx="4" fill="currentColor"/><path d="M8 13V9a6 6 0 0 1 12 0v4" stroke="currentColor" stroke-width="2.5"/></svg><h1>Пароль — дата,<span>когда мы начали общаться</span></h1><div id="dots" class="dots" role="status" aria-label="Введено 0 из 6 цифр"></div><p id="error" class="error" aria-live="polite"></p></div><div class="keys" id="keys" aria-label="Ввод пароля"></div></section></main><section id="turn" class="view" hidden><div class="rotate"><div class="phone" aria-hidden="true"></div><h2 id="turnTitle" tabindex="-1">Поверните телефон<br>горизонтально</h2><button id="landscapePlay" class="play">Открыть на весь экран ↗</button></div></section><section id="movie" hidden aria-label="Видео"><video id="video" playsinline preload="auto" disablepictureinpicture src="screen.mp4"></video><div id="fallback" hidden><button id="play">▶ Смотреть со звуком</button></div></section><script>
const $=id=>document.getElementById(id),video=$('video');const CODE='311026';let entered='',unlocked=false,started=false,busy=false;
for(let i=0;i<6;i++){let d=document.createElement('span');d.className='dot';$('dots').append(d)}
const letters=['','', 'ABC','DEF','GHI','JKL','MNO','PQRS','TUV','WXYZ'];
for(const value of ['1','2','3','4','5','6','7','8','9','','0','delete']){let b=document.createElement('button');b.type='button';b.className='key';if(value===''){b.classList.add('empty');b.tabIndex=-1;b.setAttribute('aria-hidden','true')}else if(value==='delete'){b.classList.add('delete');b.textContent='Удалить';b.onclick=erase}else{b.innerHTML='<span class="digit">'+value+'</span><span class="letters">'+letters[Number(value)]+'</span>';b.setAttribute('aria-label',value);b.onclick=()=>input(value)}$('keys').append(b)}
function draw(){[...$('dots').children].forEach((d,i)=>d.classList.toggle('filled',i<entered.length));$('dots').setAttribute('aria-label','Введено '+entered.length+' из 6 цифр')}
function erase(){if(busy||unlocked)return;entered=entered.slice(0,-1);$('error').textContent='';draw()}
function input(d){if(busy||unlocked||entered.length>=6)return;entered+=d;$('error').textContent='';draw();if(entered.length===6){if(entered===CODE)unlock();else{busy=true;$('error').textContent='Неверный пароль. Попробуйте ещё раз';$('dots').classList.add('shake');setTimeout(()=>{entered='';busy=false;draw();$('dots').classList.remove('shake')},500)}}}
function unlock(){unlocked=true;$('gate').hidden=true;$('turn').hidden=false;$('turnTitle').focus();video.muted=false;video.volume=1;$('landscapePlay').hidden=false;}
let watchdog;
function retry(message){clearTimeout(watchdog);$('fallback').hidden=false;$('play').textContent=message||'▶ Нажмите для запуска';}
function start(){if(!unlocked)return;document.body.classList.add('playing');$('movie').hidden=false;$('fallback').hidden=true;video.muted=false;video.volume=1;
if(video.error)video.load();if(video.ended)video.currentTime=0;
clearTimeout(watchdog);watchdog=setTimeout(()=>{if(video.paused||video.readyState<3)retry('▶ Повторить запуск')},10000);
try{const promise=video.play();enterFullscreen();if(promise)promise.catch(()=>retry('▶ Смотреть со звуком'));}catch(e){retry('▶ Повторить запуск')}
}
function enterFullscreen(){try{if(video.requestFullscreen){const p=video.requestFullscreen();if(p&&p.catch)p.catch(()=>{});}else if(video.webkitEnterFullscreen){video.webkitEnterFullscreen();}}catch(e){/* Inline playback remains available when fullscreen is unavailable. */}}
$('play').onclick=start;$('landscapePlay').onclick=start;video.onplaying=()=>{clearTimeout(watchdog);started=true;$('fallback').hidden=true};video.onerror=()=>{if(unlocked&& !$('movie').hidden)retry('Видео не загрузилось. Повторить')};video.onended=()=>retry('↻ Ещё раз');
document.addEventListener('keydown',e=>{if(unlocked)return;if(/^\d$/.test(e.key)){e.preventDefault();input(e.key)}else if(e.key==='Backspace'){e.preventDefault();erase()}});
</script></body></html>
