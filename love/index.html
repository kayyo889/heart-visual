<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#c5b5e4"><title>Для тебя</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}html,body{margin:0;min-height:100%;background:#c5b5e4;color:#302541;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}body{min-height:100svh;background:radial-gradient(ellipse at 15% 0%,#e7dcf5 0%,transparent 65%),linear-gradient(150deg,#d1c2e9,#b7a2d6)}button{font:inherit;color:inherit;cursor:pointer;border:0}button:focus-visible{outline:3px solid #674b88;outline-offset:5px}[hidden]{display:none!important}.view{min-height:100svh;display:flex;align-items:center;justify-content:center;padding:24px}.lock{width:min(100%,360px);text-align:center;padding:16px 0}.icon{width:27px;height:31px;margin:0 auto 24px}h1{font-size:22px;font-weight:500;line-height:1.5;margin:0 0 23px}h1 span{display:block;font-size:17px;font-weight:400}.dots{display:flex;justify-content:center;gap:18px;margin-bottom:12px}.dot{width:13px;height:13px;border:1.5px solid #51405f;border-radius:50%}.dot.filled{background:#51405f}.error{font-size:13px;height:20px;margin:12px 0 20px;color:#62334e}.keys{display:grid;grid-template-columns:repeat(3,78px);gap:17px 25px;justify-content:center}.key{border-radius:50%;height:78px;background:#ffffff45;display:flex;align-items:center;justify-content:center;flex-direction:column;touch-action:manipulation}.key:active{background:#fff9}.digit{font-size:32px;line-height:35px;font-weight:300}.letters{font-size:10px;letter-spacing:2px;height:13px}.delete{background:none;font-size:13px}.empty{visibility:hidden}.rotate{text-align:center;max-width:400px}.phone{width:52px;height:90px;border:3px solid #51405f;border-radius:12px;margin:0 auto 45px;transform:rotate(90deg)}.phone:after{content:'';display:block;width:18px;height:3px;background:#51405f;border-radius:5px;margin:7px auto}.rotate h2{font-size:25px;font-weight:500;line-height:1.5}.play{background:#ffffff60;border:1px solid #ffffff70;padding:15px 25px;border-radius:28px;margin-top:20px}#movie{position:fixed;inset:0;background:black;z-index:5;display:flex;align-items:center;justify-content:center}video{width:100%;height:100%;object-fit:contain}#fallback{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:#000a;color:white}#fallback button{background:#ffffff25;border:1px solid #fff8;padding:18px 28px;border-radius:30px}body.playing{background:black}body.playing #gate,body.playing #turn{display:none}.shake{animation:shake .3s}@keyframes shake{25%,75%{transform:translateX(-7px)}50%{transform:translateX(7px)}}@media(max-height:680px) and (orientation:portrait){.lock{padding:0}.icon{margin-bottom:15px}h1{margin-bottom:17px}.key{height:66px}.keys{grid-template-columns:repeat(3,66px);gap:12px 24px}.error{margin:8px 0 12px}}@media(orientation:landscape) and (max-height:550px){.view{padding:12px}.lock{width:640px;display:grid;grid-template-columns:1fr 1fr;align-items:center}.heading{padding:20px}.keys{grid-template-columns:repeat(3,58px);gap:9px 20px}.key{height:58px}.digit{font-size:26px}.icon{margin-bottom:15px}}@media(prefers-reduced-motion:reduce){.shake{animation:none}}

#universe{position:fixed;inset:0;background:#100b18;color:#fce4ef;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none}#poem{position:absolute;bottom:max(11%,70px);left:20px;right:20px;text-align:center;pointer-events:none;opacity:0;transition:opacity 2s}#poem.show{opacity:1}#poem small{font-size:10px;letter-spacing:4px;color:#c295b6}#poem h2{font:400 clamp(24px,5vw,44px)/1.2 Georgia,serif;margin:15px 0}#poem p{font-size:12px;color:#bfa2ba;letter-spacing:1px}#replay{position:absolute;right:20px;top:max(20px,env(safe-area-inset-top));border:1px solid #ffffff28;border-radius:50%;width:44px;height:44px;background:#ffffff08;color:#edd4e4;font-size:24px}#sceneLabel{position:absolute;top:32px;left:25px;font-size:10px;letter-spacing:3px;color:#bc9db6;pointer-events:none}@media(orientation:landscape) and (max-height:550px){#poem{bottom:5%}#poem h2{font-size:24px;margin:8px}#poem p{margin:5px}}
</style></head><body><main id="gate" class="view"><section class="lock"><div class="heading"><svg class="icon" viewBox="0 0 28 32" fill="none" aria-hidden="true"><rect x="4" y="13" width="20" height="16" rx="4" fill="currentColor"/><path d="M8 13V9a6 6 0 0 1 12 0v4" stroke="currentColor" stroke-width="2.5"/></svg><h1>Пароль — дата,<span>когда мы начали общаться</span></h1><div id="dots" class="dots" role="status" aria-label="Введено 0 из 6 цифр"></div><p id="error" class="error" aria-live="polite"></p></div><div class="keys" id="keys" aria-label="Ввод пароля"></div></section></main><section id="universe" hidden aria-label="Объёмное сердце из собирающихся частиц"><canvas id="canvas" aria-label="Вращающееся сердце. Проведите пальцем, чтобы повернуть его."></canvas><span id="sceneLabel">31 / 10 / 2026</span><button id="replay" aria-label="Собрать сердце заново">↻</button><div id="poem"><h2>Всё складывается в тебя.</h2><p>Коснись сердца. Поверни его.</p></div></section><script>
const $=id=>document.getElementById(id);const CODE='311026';let entered='',unlocked=false,started=false,busy=false;
for(let i=0;i<6;i++){let d=document.createElement('span');d.className='dot';$('dots').append(d)}
const letters=['','', 'ABC','DEF','GHI','JKL','MNO','PQRS','TUV','WXYZ'];
for(const value of ['1','2','3','4','5','6','7','8','9','','0','delete']){let b=document.createElement('button');b.type='button';b.className='key';if(value===''){b.classList.add('empty');b.tabIndex=-1;b.setAttribute('aria-hidden','true')}else if(value==='delete'){b.classList.add('delete');b.textContent='Удалить';b.onclick=erase}else{b.innerHTML='<span class="digit">'+value+'</span><span class="letters">'+letters[Number(value)]+'</span>';b.setAttribute('aria-label',value);b.onclick=()=>input(value)}$('keys').append(b)}
function drawPasscode(){[...$('dots').children].forEach((d,i)=>d.classList.toggle('filled',i<entered.length));$('dots').setAttribute('aria-label','Введено '+entered.length+' из 6 цифр')}
function erase(){if(busy||unlocked)return;entered=entered.slice(0,-1);$('error').textContent='';drawPasscode()}
function input(d){if(busy||unlocked||entered.length>=6)return;entered+=d;$('error').textContent='';drawPasscode();if(entered.length===6){if(entered===CODE)unlock();else{busy=true;$('error').textContent='Неверный пароль. Попробуйте ещё раз';$('dots').classList.add('shake');setTimeout(()=>{entered='';busy=false;drawPasscode();$('dots').classList.remove('shake')},500)}}}

function unlock(){unlocked=true;$('gate').hidden=true;$('universe').hidden=false;begin();}
document.addEventListener('keydown',e=>{if(unlocked)return;if(/^\d$/.test(e.key)){e.preventDefault();input(e.key)}else if(e.key==='Backspace'){e.preventDefault();erase()}});
const canvas=$('canvas'),ctx=canvas.getContext('2d'),reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
const eyes=new Image();let photoReady=false,photoFailed=false;eyes.onload=()=>{photoReady=true};eyes.onerror=()=>{photoFailed=true};eyes.src='./photo_2026-11-15_15-15-24.jpg';
let W=0,H=0,dpr=1,particles=[],epoch=0,last=0,time=0,angle=0,drag=0,tilt=0,pointer=null,frame=0,active=false;
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=Math.round(W*dpr);canvas.height=Math.round(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
function field(x,y,z){return (x*x+2.25*y*y+z*z-1)**3-x*x*z*z*z-.1125*y*y*z*z*z}
function surface(i,n){const z=1-2*(i+.5)/n,phi=i*2.399963229728653,rr=Math.sqrt(1-z*z),x=rr*Math.cos(phi),y=rr*Math.sin(phi);let lo=0,hi=2;for(let k=0;k<26;k++){const m=(lo+hi)/2;if(field(m*x,m*y,m*z)>0)hi=m;else lo=m}return {x:x*lo,y:y*lo,z:z*lo}}
function init(){particles=[];const n=1400;for(let i=0;i<n;i++){const p=surface(i,n),a=Math.random()*Math.PI*2;particles.push({...p,col:i%40,row:Math.floor(i/40),ax:Math.cos(a)*(1.2+Math.random()),ay:Math.sin(a)*(1.2+Math.random()),delay:Math.random()*1.8,spin:Math.random()*Math.PI*2,size:1.1+Math.random()*2.1,hue:325+Math.random()*28,light:61+Math.random()*24})}}
function begin(){active=true;resize();if(!particles.length)init();time=0;last=0;angle=0;drag=0;tilt=0;$('poem').classList.remove('show');cancelAnimationFrame(frame);frame=requestAnimationFrame(draw)}
function draw(now){if(!active)return;const dt=last?Math.min((now-last)/1000,.04):0;last=now;if(photoReady||photoFailed)time+=dt;if(!reduce&&pointer===null&&time>5)angle+=dt*.23;const t=reduce?12:time;const scale=Math.min(W*.31,H*.29);const cx=W*.5,cy=H*.44;ctx.clearRect(0,0,W,H);const glow=ctx.createRadialGradient(cx,cy,0,cx,cy,Math.max(W,H)*.65);glow.addColorStop(0,'#30152e');glow.addColorStop(.5,'#160d20');glow.addColorStop(1,'#0b0912');ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);
for(let i=0;i<60;i++){const sx=((i*137.508)%997)/997*W,sy=((i*227.37)%991)/991*H;ctx.globalAlpha=.12+.12*Math.sin(i+time*.5);ctx.fillStyle='#ffe0f4';ctx.fillRect(sx,sy,i%7===0?2:1,1)}ctx.globalAlpha=1;

if(!photoReady&&!photoFailed){ctx.fillStyle='#e8cbdf';ctx.font='16px sans-serif';ctx.textAlign='center';ctx.fillText('Один момент…',cx,cy);frame=requestAnimationFrame(draw);return}
const iw=photoReady?eyes.naturalWidth:828,ih=photoReady?eyes.naturalHeight:731;
const pw=Math.min(W*.84,440,H*.63*iw/ih),ph=pw*ih/iw;
if(photoReady&&t<2.2){ctx.globalAlpha=Math.min(1,t/0.65);ctx.drawImage(eyes,cx-pw/2,cy-ph/2,pw,ph);ctx.globalAlpha=1;frame=requestAnimationFrame(draw);return}
const a=angle+drag,c=Math.cos(a),s=Math.sin(a),ct=Math.cos(tilt),st=Math.sin(tilt),pulse=reduce?1:1+.018*Math.sin(time*2);const points=[];
for(const p of particles){let u=Math.min(1,Math.max(0,(t-2.2-p.delay*.45)/4.8)),e=u*u*u*(u*(u*6-15)+10);const x=p.x*c+p.y*s,depth=-p.x*s+p.y*c,z=p.z*ct-depth*st,dep=p.z*st+depth*ct,pers=3.8/(3.8-dep);const tx=cx+x*scale*pers*pulse,ty=cy-z*scale*pers*pulse;const burst=Math.sin(u*Math.PI)*(1-u);const ox=cx-pw/2+(p.col+.5)*pw/40,oy=cy-ph/2+(p.row+.5)*ph/35;
points.push({x:ox*(1-e)+tx*e+p.ax*W*.36*burst,y:oy*(1-e)+ty*e+p.ay*H*.26*burst,depth:dep,size:p.size*pers,alpha:1-e+e*(.55+(dep+1)*.2),hue:p.hue,light:p.light,rot:p.spin*Math.sin(u*Math.PI),e,col:p.col,row:p.row})}
points.sort((a,b)=>a.depth-b.depth);
for(const p of points){ctx.globalAlpha=Math.min(1,p.alpha);ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);
const tw=pw/40*(1-p.e)+p.size*2*p.e,th=ph/35*(1-p.e)+p.size*2*p.e;
if(photoReady&&p.e<.98){ctx.drawImage(eyes,p.col*iw/40,p.row*ih/35,iw/40,ih/35,-tw/2,-th/2,tw+.35,th+.35)}
ctx.globalAlpha*=photoReady?Math.min(1,p.e*1.4):1;ctx.fillStyle=`hsl(${p.hue} 85% ${p.light}%)`;ctx.beginPath();ctx.moveTo(0,-p.size*1.5);ctx.lineTo(p.size,.5*p.size);ctx.lineTo(0,p.size);ctx.lineTo(-p.size,-.4*p.size);ctx.closePath();ctx.fill();ctx.restore()}
ctx.globalAlpha=1;if(t>8)$('poem').classList.add('show');frame=requestAnimationFrame(draw)}
canvas.addEventListener('pointerdown',e=>{pointer={id:e.pointerId,x:e.clientX,y:e.clientY};canvas.setPointerCapture(e.pointerId)});canvas.addEventListener('pointermove',e=>{if(!pointer||pointer.id!==e.pointerId)return;drag+=(e.clientX-pointer.x)*.008;tilt=Math.max(-.65,Math.min(.65,tilt+(e.clientY-pointer.y)*.005));pointer.x=e.clientX;pointer.y=e.clientY});function release(){pointer=null}canvas.addEventListener('pointerup',release);canvas.addEventListener('pointercancel',release);$('replay').onclick=begin;addEventListener('resize',()=>{if(active)resize()});document.addEventListener('visibilitychange',()=>{last=0;if(document.hidden)cancelAnimationFrame(frame);else if(active)frame=requestAnimationFrame(draw)});
</script></body></html>
